<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HallLine — Student Kiosk</title>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/views/kiosk.css">
</head>
<body class="page-kiosk">
  <header class="kiosk-header"></header>

  <section class="kiosk-setup" hidden></section>

  <main class="kiosk-grid">
    <section class="kiosk-checkout">
      <section class="checkout-signin"></section>
      <section class="checkout-webcam" hidden></section>
      <section class="checkout-destinations" hidden></section>
    </section>

    <section class="kiosk-active-passes"></section>
  </main>

  <section class="return-verify-prompt" hidden></section>
</body>
</html>
